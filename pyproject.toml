[project]
name = "pythonproject1"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "authx>=1.7.1",
    "fastapi>=0.139.2",
    "mypy>=2.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "ruff>=0.15.22",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these files; the boilerplate imports are not always used.
"alembic/versions/*.py" = ["F401"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
